name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Fmt, Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --all-targets

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  no-std:
    name: no_std / alloc features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Library only: bin and examples require the `std` feature.
      - name: Core only (lib)
        run: cargo check --no-default-features --lib

      - name: Alloc without std (lib)
        run: cargo check --no-default-features --features alloc --lib

      - name: Clippy core-only (lib)
        run: cargo clippy --no-default-features --lib -- -D warnings

      - name: Clippy alloc-only (lib)
        run: cargo clippy --no-default-features --features alloc --lib -- -D warnings
