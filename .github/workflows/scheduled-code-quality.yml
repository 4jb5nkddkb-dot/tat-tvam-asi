name: Scheduled Code Quality Autofix

on:
  schedule:
    # Every day at 02:00 UTC (10:00 CST)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format code
        run: cargo fmt

      - name: Apply Clippy fixes (non-blocking)
        run: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings || true

      - name: Check Clippy
        run: cargo clippy -- -D warnings || true

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: cargo test --quiet || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes directly to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-format code and apply quality fixes"
          git push origin main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No code quality changes needed."
