name: Scheduled Code Quality Autofix

on:
  schedule:
    # Every day at 02:00 UTC (10:00 CST)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format code
        run: cargo fmt

      - name: Apply Clippy fixes (non-blocking)
        run: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings || true

      - name: Check Clippy
        run: cargo clippy -- -D warnings || true

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: cargo test --quiet || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with fixes
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-format code and apply quality fixes"
          title: "chore: automated code quality improvements"
          body: |
            Automated code quality fixes from scheduled workflow.
            
            - rustfmt
            - clippy --fix
            
            Please review before merging.
          branch: auto-code-quality
          delete-branch: true
          labels: automated,code-quality

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No code quality changes needed."
