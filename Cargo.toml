[package]
name = "tat-tvam-asi"
version = "0.2.0"
edition = "2021"
authors = ["Zhanying Jia <Dayan>"]
description = "Rust × Sanskrit closed-loop system — Project Tat Tvam Asi (彼即汝)"
license = "MIT"
repository = "https://github.com/4jb5nkddkb-dot/tat-tvam-asi"
readme = "README.md"
keywords = ["rust", "sanskrit", "zero-cost", "ownership", "philosophy"]
categories = ["rust-patterns", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "tat_tvam_asi"
path = "src/lib.rs"

[[bin]]
name = "tat-tvam-asi"
path = "src/main.rs"
required-features = ["std"]

[[bench]]
name = "sacred_map"
harness = false
