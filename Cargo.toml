[package]
name = "tat-tvam-asi"
version = "0.1.0"
edition = "2021"
authors = ["Zhanying Jia <Dayan>"]
description = "Rust × Sanskrit closed-loop system — Project Tat Tvam Asi (彼即汝)"
license = "MIT"
repository = "https://github.com/4jb5nkddkb-dot/tat-tvam-asi"
readme = "README.md"
keywords = ["rust", "sanskrit", "zero-cost", "ownership", "philosophy"]
categories = ["rust-patterns", "no-std"]

[features]
default = ["std"]
# Full standard library (binaries & most examples).
std = ["alloc"]
# Heap types (Vec, String) without full std — enables law/essence on embedded+alloc.
alloc = []

[dependencies]

[lib]
name = "tat_tvam_asi"
path = "src/lib.rs"

[[bin]]
name = "tat-tvam-asi"
path = "src/main.rs"
required-features = ["std"]
